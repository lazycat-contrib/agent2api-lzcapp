params:
    - id: admin_user
      type: string
      name: "Admin username"
      description: "Panel admin username, preset at install time. Together with the password below, the panel never offers an open sign-up page."
      default_value: "admin"

    - id: admin_password
      type: secret
      name: "Admin password"
      description: "Panel admin password — required. Fill in plain text; the container converts it to a bcrypt hash on first start. If left empty, anyone who can reach the domain could register an admin account through the login page."
      default_value: ""

    - id: allow_no_key
      type: string
      name: "Allow keyless /v1 (0/1)"
      description: "1 = serve /v1 even with no gateway key (fail-open — fully-internal debugging only). 0 = fail-closed until the first key is created in the panel. Keep 0."
      default_value: "0"
      optional: true

    - id: captcha_enabled
      type: string
      name: "Login captcha (1 on / 0 off)"
      description: "1 = keep the login-page human-verification captcha (default). 0 = disable it. Keep 1 for any internet-reachable instance."
      default_value: "1"
      optional: true

locales:
